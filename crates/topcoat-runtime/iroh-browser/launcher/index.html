<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connect to app</title>
    <script type="module" src="/__topcoat/launcher.js"></script>
    <style>
        body { font: 1rem system-ui, sans-serif; max-width: 36rem; margin: 15vh auto; padding: 1.5rem; }
        label { display: block; margin-bottom: .5rem; }
        input { box-sizing: border-box; width: 100%; padding: .75rem; }
        button { margin-top: 1rem; padding: .6rem 1.2rem; }
        #status { overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <h1>Connect to app</h1>
    <form>
        <label for="endpoint">App address</label>
        <input id="endpoint" name="endpoint" required autocomplete="off" spellcheck="false">
        <button type="submit">Connect</button>
    </form>
    <p id="status" role="status">Loading...</p>
</body>
</html>
