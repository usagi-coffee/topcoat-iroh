[package]
name = "topcoat-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
iroh = ["router", "topcoat-router/iroh", "dep:iroh", "dep:bytes", "dep:tokio-util", "dep:uuid", "tokio/time"]
router = [
	"dep:futures-util",
	"dep:pin-project-lite",
	"dep:tokio",
	"dep:topcoat-router",
]

[dependencies]
topcoat-asset.workspace = true
topcoat-core.workspace = true
topcoat-router = { workspace = true, optional = true }
topcoat-view.workspace = true
topcoat-view-macro.workspace = true

pin-project-lite = { workspace = true, optional = true }
ref-cast.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
topcoat-router = { workspace = true, optional = true, features = ["websocket"] }

futures-util = { workspace = true, optional = true, features = ["sink"] }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "macros"] }
iroh = { workspace = true, optional = true, features = ["tls-ring"] }
bytes = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true, features = ["codec"] }
uuid = { workspace = true, optional = true, features = ["v4", "serde"] }

[dev-dependencies]
# We cannot use `workspace = true` with `default-features = false`.
topcoat = { path = "../topcoat", default-features = false, features = ["asset", "router", "runtime", "view", "fs"] }

tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
